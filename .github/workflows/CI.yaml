name: Go and Auto Tag (v0.yy.m-dhhmm)

on:
  push:
    branches: [main, master]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/CI.yaml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.7", "1.26"]

    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U testuser -d testdb; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Wait for Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools
          until redis-cli -h localhost -p 6379 ping | grep -q PONG; do
            echo "Waiting for Redis..."
            sleep 2
          done

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests (matrix)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: testdb
          DB_USER: testuser
          DB_PASSWORD: testpass
          DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb?sslmode=disable
          # Redis
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_ADDR: localhost:6379
          APP_ENV: test
        run: |
          if [ "${{ matrix.go-version }}" = "1.25.7" ]; then
            echo "Running race detector (latest Go only)..."
            go test -v -race ./...

            echo "Running coverage (separate from race)..."
            go test -v -coverprofile=coverage.out -covermode=atomic ./...
          else
            echo "Running standard tests..."
            go test -v ./...
          fi

      - name: Upload results to Codecov
        if: matrix.go-version == '1.25.7'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.0", "1.25.7"]
    name: Build ${{ matrix.go-version == '1.26.0' && '(latest)' || '1.25.7' }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Install goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          export PATH="$HOME/go/bin:$PATH"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Download dependencies
        run: go mod download

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  create-tag:
    runs-on: ubuntu-latest
    needs: [test, build]
    env:
      TZ: Asia/Jakarta
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deteksi perubahan signifikan (non-test & non-yaml)
        id: changes
        run: |
          git fetch origin ${{ github.base_ref }} --quiet || true

          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          SIGNIFICANT_COUNT=$(echo "$CHANGED_FILES" | grep -vE '(_test\.go$|\.ya?ml$)' | wc -l | tr -d ' ')
          if [ "$SIGNIFICANT_COUNT" -eq 0 ]; then
            echo "only_non_significant=true" >> "$GITHUB_OUTPUT"
            echo "Semua perubahan hanya *_test.go dan/atau *.yaml, create-tag akan di-skip."
          else
            echo "only_non_significant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hitung versi tag (WIB)
        id: ver
        if: steps.changes.outputs.only_non_significant == 'false'
        run: |
          sudo ln -sf /usr/share/zoneinfo/$TZ /etc/localtime
          yy=$(date +%y)
          m=$(date +%-m)
          d=$(date +%-d)
          HH=$(date +%H)
          MM=$(date +%M)

          tag="v0.${yy}.${m}-${d}${HH}${MM}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag yang akan dibuat: $tag"

      - name: Cek apakah tag sudah ada
        id: check
        if: steps.changes.outputs.only_non_significant == 'false'
        run: |
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag sudah ada, tidak perlu membuat ulang."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Buat dan push tag
        if: steps.changes.outputs.only_non_significant == 'false' && steps.check.outputs.exists == 'false'
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Auto tag $tag"
          git push origin "$tag"
